site_name: 浙江高考 Wikipedia
site_description: 中国高考知识百科，涵盖全部学科的知识体系
site_author: 浙江高考 Wikipedia 贡献者
site_url: https://zhzx2026.github.io/gaokao-wiki
repo_name: zhzx2026/gaokao-wiki
repo_url: https://github.com/zhzx2026/gaokao-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zhzx2026/gaokao-wiki

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - footnotes
  - toc:
      permalink: true
      toc_depth: 2
  - attr_list
  - md_in_html

plugins:
  - search:
      lang:
        - zh
        - en

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js

nav:
  - 首页: index.md
  - 数学:
      - 总览: math/index.md
      - 必修第一册:
          - 集合与常用逻辑用语: math/set-logic.md
          - 等式与不等式: math/inequality.md
          - 函数的概念与性质: math/function.md
          - 幂指对函数: math/power-exp-log.md
          - 三角函数与恒等变换: math/trigonometry.md
      - 必修第二册:
          - 解三角形: math/triangle.md
          - 平面向量: math/vectors.md
          - 立体几何初步: math/solid-geometry.md
          - 复数: math/complex.md
      - 选择性必修第一册:
          - 空间向量与立体几何: math/space-vector.md
          - 直线与圆: math/line-circle.md
          - 圆锥曲线: math/conics.md
      - 选择性必修第二册:
          - 数列: math/sequences.md
          - 导数及其应用: math/derivative.md
      - 选择性必修第三册:
          - 计数原理与二项式定理: math/counting.md
          - 概率与随机变量: math/probability.md
          - 统计与成对数据: math/statistics.md